services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./coachflow_project
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./coachflow_project/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    # collectstatic + migrate à chaque démarrage, puis gunicorn
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput && \
        python manage.py collectstatic --noinput && \
        exec gunicorn coachflow_project.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile -

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - media:/srv/media:ro
      - static:/srv/static:ro
    depends_on:
      - backend

volumes:
  pg_data:
  media:
  static:
  caddy_data:
  caddy_config:
