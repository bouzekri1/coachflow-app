        <rect x="0" y="0" width="4" height="178" rx="2" fill="#6366F1"/>
        <text x="20" y="28" font-size="10" font-weight="800" fill="#4338CA" letter-spacing="0.5">MÉSOCYCLE 1 · SEMAINES 1-4</text>
        <text x="20" y="48" font-size="15" font-weight="800" fill="#0F172A">Adaptation anatomique</text>
        <text x="20" y="66" font-size="11" fill="#64748B">Préparer le corps, technique avant charge. Full-body 3×/sem.</text>

        <!-- Day chips -->
        <g transform="translate(20, 80)">
          <!-- Lun -->
