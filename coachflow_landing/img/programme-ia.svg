          <text x="14" y="20" font-size="10" font-weight="800" fill="#94A3B8">LUNDI · FULL BODY A</text>
          <text x="14" y="40" font-size="12" fill="#475569">• Goblet squat 4×10</text>
          <text x="14" y="56" font-size="12" fill="#475569">• Développé couché haltères 4×8</text>
          <text x="14" y="72" font-size="12" fill="#475569">• Rowing horizontal + Planche</text>

          <!-- Mer -->
          <rect x="216" y="0" width="208" height="78" rx="8" fill="#fff" stroke="#E5E7EB"/>
          <text x="230" y="20" font-size="10" font-weight="800" fill="#94A3B8">MERCREDI · FULL BODY B</text>
          <text x="230" y="40" font-size="12" fill="#475569">• Soulevé de terre roumain 4×8</text>
          <text x="230" y="56" font-size="12" fill="#475569">• Tirage poitrine 4×10</text>
          <text x="230" y="72" font-size="12" fill="#475569">• Fentes alternées + Gainage</text>

          <!-- Ven -->
          <rect x="432" y="0" width="208" height="78" rx="8" fill="#fff" stroke="#E5E7EB"/>
          <text x="446" y="20" font-size="10" font-weight="800" fill="#94A3B8">VENDREDI · FULL BODY C</text>
          <text x="446" y="40" font-size="12" fill="#475569">• Hip thrust 4×12</text>
          <text x="446" y="56" font-size="12" fill="#475569">• Développé militaire 4×8</text>
          <text x="446" y="72" font-size="12" fill="#475569">• Tractions assistées + Abdos</text>
        </g>
      </g>

      <!-- Mesocycle 2 -->
      <g transform="translate(24, 310)">
        <rect width="672" height="178" rx="10" fill="#F8FAFC" stroke="#E5E7EB"/>
        <rect x="0" y="0" width="4" height="178" rx="2" fill="#1D9E75"/>
        <text x="20" y="28" font-size="10" font-weight="800" fill="#065F46" letter-spacing="0.5">MÉSOCYCLE 2 · SEMAINES 5-8</text>
        <text x="20" y="48" font-size="15" font-weight="800" fill="#0F172A">Hypertrophie</text>
        <text x="20" y="66" font-size="11" fill="#64748B">Volume +20%, séries de 8-12 reps. Split Push / Pull / Legs.</text>

        <g transform="translate(20, 80)">
          <rect x="0" y="0" width="208" height="78" rx="8" fill="#fff" stroke="#E5E7EB"/>
          <text x="14" y="20" font-size="10" font-weight="800" fill="#94A3B8">LUNDI · PUSH</text>
          <text x="14" y="40" font-size="12" fill="#475569">• Développé couché barre 5×10</text>
          <text x="14" y="56" font-size="12" fill="#475569">• Développé militaire 4×10</text>
          <text x="14" y="72" font-size="12" fill="#475569">• Dips + Élévations latérales</text>

          <rect x="216" y="0" width="208" height="78" rx="8" fill="#fff" stroke="#E5E7EB"/>
          <text x="230" y="20" font-size="10" font-weight="800" fill="#94A3B8">MERCREDI · PULL</text>
          <text x="230" y="40" font-size="12" fill="#475569">• Tractions 5×8</text>
          <text x="230" y="56" font-size="12" fill="#475569">• Rowing barre 4×10</text>
          <text x="230" y="72" font-size="12" fill="#475569">• Curl barre + Face pulls</text>

          <rect x="432" y="0" width="208" height="78" rx="8" fill="#fff" stroke="#E5E7EB"/>
          <text x="446" y="20" font-size="10" font-weight="800" fill="#94A3B8">VENDREDI · LEGS</text>
          <text x="446" y="40" font-size="12" fill="#475569">• Front squat 5×8 (lombaires OK)</text>
          <text x="446" y="56" font-size="12" fill="#475569">• Hip thrust lourd 4×8</text>
          <text x="446" y="72" font-size="12" fill="#475569">• Curl ischios + Mollets</text>
        </g>
      </g>

      <!-- Mesocycle 3 -->
      <g transform="translate(24, 510)">
        <rect width="672" height="178" rx="10" fill="#F8FAFC" stroke="#E5E7EB"/>
        <rect x="0" y="0" width="4" height="178" rx="2" fill="#F59E0B"/>
        <text x="20" y="28" font-size="10" font-weight="800" fill="#92400E" letter-spacing="0.5">MÉSOCYCLE 3 · SEMAINES 9-12</text>
        <text x="20" y="48" font-size="15" font-weight="800" fill="#0F172A">Force maximale</text>
        <text x="20" y="66" font-size="11" fill="#64748B">Intensité 80-90% RM. Séries courtes 3-5 reps + récupération longue.</text>

        <g transform="translate(20, 80)">
          <rect x="0" y="0" width="208" height="78" rx="8" fill="#fff" stroke="#E5E7EB"/>
          <text x="14" y="20" font-size="10" font-weight="800" fill="#94A3B8">LUNDI · UPPER FORCE</text>
          <text x="14" y="40" font-size="12" fill="#475569">• Développé couché 5×5</text>
          <text x="14" y="56" font-size="12" fill="#475569">• Tractions lestées 5×3</text>
          <text x="14" y="72" font-size="12" fill="#475569">• Accessoires hypertrophie</text>

          <rect x="216" y="0" width="208" height="78" rx="8" fill="#fff" stroke="#E5E7EB"/>
          <text x="230" y="20" font-size="10" font-weight="800" fill="#94A3B8">MERCREDI · LOWER FORCE</text>
          <text x="230" y="40" font-size="12" fill="#475569">• Front squat 5×5</text>
          <text x="230" y="56" font-size="12" fill="#475569">• Hip thrust max 5×5</text>
          <text x="230" y="72" font-size="12" fill="#475569">• Accessoires postérieurs</text>

          <rect x="432" y="0" width="208" height="78" rx="8" fill="#fff" stroke="#E5E7EB"/>
          <text x="446" y="20" font-size="10" font-weight="800" fill="#94A3B8">VENDREDI · TOTAL BODY</text>
          <text x="446" y="40" font-size="12" fill="#475569">• Cleans 6×3 (technique)</text>
          <text x="446" y="56" font-size="12" fill="#475569">• Développé militaire 5×5</text>
          <text x="446" y="72" font-size="12" fill="#475569">• Finisher conditioning</text>
        </g>
