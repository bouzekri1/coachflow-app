        <text x="20" y="48" font-size="11" fill="#047857">3 mésocycles · 36 séances planifiées · adapté aux contraintes lombaires</text>
        <rect x="554" y="14" width="100" height="34" rx="8" fill="#1D9E75"/>
        <text x="604" y="36" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Assigner →</text>
