          <text x="39"  y="29" font-size="14" fill="#64748B" text-anchor="middle">2</text>
          <rect x="86"  y="0" width="78" height="44" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
          <text x="125" y="29" font-size="14" font-weight="800" fill="#4338CA" text-anchor="middle">3</text>
          <rect x="172" y="0" width="78" height="44" rx="8" fill="#fff" stroke="#E5E7EB"/>
          <text x="211" y="29" font-size="14" fill="#64748B" text-anchor="middle">4</text>
          <rect x="258" y="0" width="86" height="44" rx="8" fill="#fff" stroke="#E5E7EB"/>
          <text x="301" y="29" font-size="14" fill="#64748B" text-anchor="middle">5+</text>
        </g>
