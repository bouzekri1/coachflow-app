        <rect x="0" y="10" width="344" height="60" rx="8" fill="#F8FAFC" stroke="#E5E7EB"/>
        <text x="14" y="32" font-size="12" fill="#64748B">Légère douleur lombaire depuis 6 mois.</text>
        <text x="14" y="50" font-size="12" fill="#64748B">Préfère éviter le squat lourd.</text>
      </g>

      <!-- CTA Generate -->
      <g transform="translate(20, 644)">
        <rect width="344" height="56" rx="12" fill="url(#aiAccent)"/>
        <text x="172" y="36" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">✨ Générer le programme</text>
      </g>
    </g>

